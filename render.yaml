services:
  - type: web
    runtime: static
    name: jann-dj
    buildCommand: "true"
    staticPublishPath: ./
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
